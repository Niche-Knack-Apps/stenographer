[workspace]
resolver = "2"
members = [
    "crates/steno-core",
    "crates/steno-daemon",
    "crates/steno-cli",
]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Niche-Knack Apps"]
repository = "https://github.com/Niche-Knack-Apps/stenographer"

[workspace.dependencies]
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# CLI
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Terminal colors
colored = "3"

# Paths & system
dirs = "6"

# Regex
regex = "1"

# UUIDs
uuid = { version = "1", features = ["v4", "serde"] }

# Binary discovery
which = "8"

# File watching
notify = "7"

# Unix
nix = { version = "0.29", features = ["signal", "process", "fs"] }

# TUI fuzzy finder
skim = "3"

# Key event types (must match skim's crossterm version)
crossterm = "0.29"

# Internal crates
steno-core = { path = "crates/steno-core" }
steno-daemon = { path = "crates/steno-daemon" }
steno-cli = { path = "crates/steno-cli" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
